project:
  dpi: 150
  pdf_file: null
  png_dir: "output"
default_layout:
  bottom_left_corner: [-1, -1]
  top_right_corner: [12, 6]
  scale_numerator: 1
  scale_denominator: 40
  grid_major_step: 1
  grid_minor_step: 0.2
reusable_elements:
  dungeon_walls:
    # Room A: 0,0 to 5,5
    - type: wall
      pivot_point: [0, 0]
      length: 5
      thickness: 0.2
    - type: wall
      pivot_point: [0, 5]
      length: 5
      thickness: 0.2
    - type: wall
      pivot_point: [0, 0]
      length: 5
      thickness: 0.2
      orientation_angle: 90
    - type: wall
      pivot_point: [5, 0]
      length: 2
      thickness: 0.2
      orientation_angle: 90
    - type: door
      pivot_point: [5, 2]
      doorway_width: 1
      door_width: 0.9
      thickness: 0.1
      orientation_angle: 90
      color: gray
    - type: wall
      pivot_point: [5, 3]
      length: 2
      thickness: 0.2
      orientation_angle: 90
    # Corridor: x 5 to 8, y 2 to 3
    - type: wall
      pivot_point: [5, 3]
      length: 3
      thickness: 0.15
    - type: wall
      pivot_point: [5, 2]
      length: 3
      thickness: 0.15
    # Room B: 8,0 to 11,4
    - type: wall
      pivot_point: [8, 0]
      length: 3
      thickness: 0.2
    - type: wall
      pivot_point: [8, 4]
      length: 3
      thickness: 0.2
    - type: wall
      pivot_point: [11, 0]
      length: 4
      thickness: 0.2
      orientation_angle: 90
    - type: wall
      pivot_point: [8, 0]
      length: 2
      thickness: 0.2
      orientation_angle: 90
    - type: wall
      pivot_point: [8, 3]
      length: 1
      thickness: 0.2
      orientation_angle: 90
floor_plans:
  - title:
      text: "Sample Dungeon Floor"
      font_size: 18
    inherited_elements:
      - dungeon_walls
